<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clawd studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 8px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; accent-color: #D97757; }
  #tt { font-variant-numeric: tabular-nums; min-width: 260px; }
  button {
    background: #282230;
    color: #eee;
    border: 1px solid #483f54;
    border-radius: 4px;
    padding: 3px 9px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    line-height: 1.3;
    user-select: none;
  }
  button:hover { background: #383042; border-color: #635773; }
  button:active { background: #4a4056; }
  .shortcuts { display: flex; flex-wrap: wrap; gap: 14px; color: #8a8294; font-size: 11px; max-width: 1280px; user-select: none; }
  .shortcuts kbd { background: #25202c; border: 1px solid #443c50; border-radius: 3px; padding: 1px 4px; font-family: inherit; font-size: 10px; color: #ddd; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar">
    <button id="play" type="button" title="Play / Pause (Space)">▶</button>
    <button id="prev" type="button" title="Step back 1 frame (←)">‹</button>
    <button id="next" type="button" title="Step forward 1 frame (→)">›</button>
    <input id="scrub" type="range" min="0" max="11" step="0.0417" value="0">
    <span id="tt">loading…</span>
  </div>
  <div class="shortcuts">
    <span><kbd>Space</kbd> play / pause</span>
    <span><kbd>←</kbd> / <kbd>→</kbd> ±1 frame</span>
    <span><kbd>Shift</kbd> + <kbd>←</kbd> / <kbd>→</kbd> ±1s</span>
    <span><kbd>Home</kbd> / <kbd>End</kbd> start / end</span>
  </div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>
<!-- your video: add a script per scene file, in order -->
<script src="src/scenes/demo.js"></script>
<script>
  // Open studio.html?loop=emotions (or views) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
